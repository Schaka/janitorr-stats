jellyfin:
  base-url: http://your-jellyfin:8096
  api-key: your_api_key_here
  poll-interval: 60s # How often Jellyfin is queried for watch sessions

quarkus:
  log:
    level: INFO
    category:
      "com.github.schaka":
        level: INFO # INFO, WARN, DEBUG, TRACE
    file:
      enable: true
      path: /logs/janitorr-stats.log # mount /logs as a volume in your compose file
  datasource:
    db-kind: sqlite
    jdbc:
      url: jdbc:sqlite:/data/janitorr-stats.db
