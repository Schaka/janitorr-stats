name: Publish Native Image

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
    branches:
      - 'main'
    tags:
      - '**'

jobs:

  # Compute shared values once so both arch build jobs use identical tags.
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.tag_name.outputs.value }}
      owner_lc: ${{ steps.lc_owner.outputs.value }}
    steps:
      - name: Determine tag name
        id: tag_name
        run: |
          NAME="${{ github.ref_name }}"
          CLEAN_NAME=$(echo "$NAME" | sed 's/\//-/g')
          echo "value=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Force lower case for repository owner
        id: lc_owner
        run: echo "value=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

  build-native-amd64:
    needs: setup
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5

      # Native compilation pulls the 2 GB+ Mandrel builder image, so free space first.
      - name: Free GitHub runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          docker system prune -af

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Avoids Docker Hub rate limits when pulling the Mandrel builder image.
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push native amd64 image
        run: |
          ./gradlew build -x test \
            -Dquarkus.native.enabled=true \
            -Dquarkus.package.jar.enabled=false \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime=docker \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
        env:
          QUARKUS_CONTAINER_IMAGE_PUSH: "true"
          QUARKUS_CONTAINER_IMAGE_REGISTRY: ghcr.io
          QUARKUS_CONTAINER_IMAGE_GROUP: ${{ needs.setup.outputs.owner_lc }}
          QUARKUS_CONTAINER_IMAGE_NAME: janitorr-stats
          QUARKUS_CONTAINER_IMAGE_TAG: native-amd64-${{ needs.setup.outputs.tag_name }}
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  build-native-arm64:
    needs: setup
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push native arm64 image
        run: |
          ./gradlew build -x test \
            -Dquarkus.native.enabled=true \
            -Dquarkus.package.jar.enabled=false \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime=docker \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
        env:
          QUARKUS_CONTAINER_IMAGE_PUSH: "true"
          QUARKUS_CONTAINER_IMAGE_REGISTRY: ghcr.io
          QUARKUS_CONTAINER_IMAGE_GROUP: ${{ needs.setup.outputs.owner_lc }}
          QUARKUS_CONTAINER_IMAGE_NAME: janitorr-stats
          QUARKUS_CONTAINER_IMAGE_TAG: native-arm64-${{ needs.setup.outputs.tag_name }}
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  combine-images:
    needs: [setup, build-native-amd64, build-native-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Combine the per-arch images into a single multi-arch manifest.
      # On a v-prefixed tag release, also push a stable tag.
      - uses: int128/docker-manifest-create-action@v2
        with:
          push: true
          tags: |
            ghcr.io/${{ needs.setup.outputs.owner_lc }}/janitorr-stats:native-${{ needs.setup.outputs.tag_name }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/janitorr-stats:native-stable', needs.setup.outputs.owner_lc) || '' }}
          sources: |
            ghcr.io/${{ needs.setup.outputs.owner_lc }}/janitorr-stats:native-amd64-${{ needs.setup.outputs.tag_name }}
            ghcr.io/${{ needs.setup.outputs.owner_lc }}/janitorr-stats:native-arm64-${{ needs.setup.outputs.tag_name }}
