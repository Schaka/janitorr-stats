name: Test and Generate

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
    branches:
      - 'main'
    tags:
      - '**'

jobs:

  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.tag_name.outputs.value }}
    steps:
      - name: Determine tag name
        id: tag_name
        run: |
          NAME="${{ github.ref_name }}"
          CLEAN_NAME=$(echo "$NAME" | sed 's/\//-/g')
          echo "value=$CLEAN_NAME" >> $GITHUB_OUTPUT

  # Run JVM unit tests, build a native binary, run integration tests against it,
  # and generate the OpenAPI spec — all in one Gradle invocation.
  # Native image builds in separate workflows start only after this succeeds.
  test-and-generate:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      # Native compilation pulls the 2 GB+ Mandrel builder image, so free space first.
      - name: Free GitHub runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          docker system prune -af

      - name: Run tests, build native, and run integration tests
        run: |
          ./gradlew build quarkusIntTest \
            -Dquarkus.native.enabled=true \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime=docker \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25 \
            -Dquarkus.smallrye-openapi.enabled=true \
            --no-build-cache

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/reports/tests/quarkusIntTest/

      - name: Save OpenAPI spec as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: build/openapi/openapi.yaml
          if-no-files-found: error

  publish-openapi:
    needs: [setup, test-and-generate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download OpenAPI spec artifact
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec

      - name: Upload OpenAPI spec to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.setup.outputs.tag_name }} --generate-notes || true
          gh release upload ${{ needs.setup.outputs.tag_name }} openapi.yaml --clobber
