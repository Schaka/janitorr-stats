jellyfin:
  poll-interval: 60s

quarkus:
  application:
    name: janitorr-stats

  datasource:
    db-kind: postgresql

  hibernate-orm:
    database:
      generation: none
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    migrate-at-start: true
    locations: db/migration/common,db/migration/{vendor}

  rest-client:
    jellyfin-api:
      url: ${jellyfin.base-url}
      scope: jakarta.inject.Singleton

  smallrye-openapi:
    # Write the spec to disk at build time; the runtime endpoint is not needed.
    store-schema-directory: build/openapi
    enable: false

  container-image:
    registry: ghcr.io
    group: schaka
    name: janitorr-stats

  jib:
    base-jvm-image: registry.access.redhat.com/ubi9/openjdk-25-runtime:latest
    base-native-image: quay.io/quarkus/ubi9-quarkus-micro-image:2.0

  log:
    level: INFO
    category:
      "com.github.schaka":
        level: INFO

"%dev":
  quarkus:
    datasource:
      devservices:
        enabled: true
    flyway:
      locations: db/migration/common,db/migration/postgres

